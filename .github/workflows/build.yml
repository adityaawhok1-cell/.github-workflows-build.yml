name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Siapkan proyek
        run: |
          echo '' | base64 -d > proyek.zip
          unzip -q proyek.zip
      - name: Ambil pdf.js (masuk ke aset APK)
        run: |
          set -e
          mkdir -p /tmp/pdfjs && cd /tmp/pdfjs
          npm pack pdfjs-dist@5.6.205 --silent
          tar xzf pdfjs-dist-5.6.205.tgz
          D="$GITHUB_WORKSPACE/pembaca-komik-android/app/src/main/assets/pdfjs"
          mkdir -p "$D"
          cp package/legacy/build/pdf.min.mjs package/legacy/build/pdf.worker.min.mjs "$D"/
          cp -r package/cmaps package/standard_fonts package/wasm package/iccs "$D"/
          du -sh "$D"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: pembaca-komik-android
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Pembaca-Komik-apk
          path: pembaca-komik-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
