name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Siapkan proyek
        run: |
          echo '' | base64 -d > proyek.zip
          unzip -q proyek.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: pembaca-komik-android
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Pembaca-Komik-apk
          path: pembaca-komik-android/app/build/outputs/apk/debug/app-debug.apk
