name: 📱 Build APK

# Nama yang tampil di daftar Actions, contoh: "Build APK • 2.6.0 • oleh budi"
run-name: Build APK • ${{ github.ref_name }} • oleh ${{ github.actor }}

on:
  push:
    branches: [main, master]
  workflow_dispatch:        # tombol "Run workflow" manual

permissions:
  contents: read

concurrency:                # build lama dibatalkan jika ada push baru
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  PDFJS_VERSION: 5.6.205    # versi pdf.js yang dimasukkan ke APK

jobs:
  build:
    name: 🔨 Bangun APK
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 📥 Ambil kode
        uses: actions/checkout@v4

      - name: ☕ Siapkan Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 🐘 Siapkan Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: 📄 Unduh pdf.js (masuk ke aset APK)
        run: |
          npm pack "pdfjs-dist@$PDFJS_VERSION" --silent
          tar xzf "pdfjs-dist-$PDFJS_VERSION.tgz"
          D=app/src/main/assets/pdfjs
          mkdir -p "$D"
          cp package/legacy/build/pdf.min.mjs package/legacy/build/pdf.worker.min.mjs "$D/"
          cp -r package/cmaps package/standard_fonts package/wasm package/iccs "$D/"

      - name: 🔨 Build APK
        run: gradle assembleDebug --no-daemon

      - name: 🏷️ Baca versi & ukuran
        id: info
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          VER=$(grep -oP "versionName '\K[^']+" app/build.gradle)
          SIZE=$(du -h "$APK" | cut -f1)
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          {
            echo "## ✅ APK siap diunduh"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Versi | **$VER** |"
            echo "| Ukuran | **$SIZE** |"
            echo "| Commit | \`${GITHUB_SHA::7}\` |"
            echo ""
            echo "Unduh dari bagian **Artifacts** di bawah halaman ini."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 📤 Unggah APK
        uses: actions/upload-artifact@v4
        with:
          name: Pembaca-Komik-v${{ steps.info.outputs.version }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
